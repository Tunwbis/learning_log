{% extends 'learning_logs/base.html' %}

{% block page_header %}

{% block content %}

 <form action="{% url 'accounts:login' %}" method='post' class="mt-3">
  {% csrf_token %}
  {{ form.as_p}}

 </form>

{% endblock content %}
